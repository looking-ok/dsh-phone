name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时自动拉取上游更新
  workflow_dispatch:        # 也可以在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from upstream
        env:
          UPSTREAM_REPO: jwoo1982217-eng/dsh-phone
          UPSTREAM_BRANCH: main
        run: |
          set -e
          git config user.name "looking-ok"
          git config user.email "770017822@qq.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --prune

          # 把上游最新提交合并到本地对应分支（-X theirs：冲突时以上游为准）
          git checkout -B "${UPSTREAM_BRANCH}" "origin/${UPSTREAM_BRANCH}" || git checkout -B "${UPSTREAM_BRANCH}"
          git merge --no-edit -X theirs "upstream/${UPSTREAM_BRANCH}" || echo "merge skipped/conflict resolved"
          git push origin "HEAD:${UPSTREAM_BRANCH}"
          git push origin --tags